<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ARCADE banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#818cf8" stroke-opacity="0.10"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- stars -->
    <g fill="#e0e7ff">
      <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="230" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="40" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="255" r="1.6"><animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="50" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="210" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- meteors -->
    <g transform="rotate(35)">
      <g>
        <rect x="-200" y="20" width="160" height="2.5" rx="1.2" fill="url(#trail)"/>
        <circle cx="-40" cy="21" r="2.6" fill="#fff"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="5s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="-420" y="-110" width="200" height="2.5" rx="1.2" fill="url(#trail)"/>
        <circle cx="-220" cy="-109" r="2.6" fill="#fff"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1700 0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="-300" y="150" width="130" height="2" rx="1" fill="url(#trail)"/>
        <circle cx="-170" cy="151" r="2.2" fill="#fff"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="6s" begin="3s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- title -->
    <text x="600" y="150" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="104" font-weight="800" letter-spacing="18" fill="url(#title)">ARCADE
      <animate attributeName="opacity" values="0.92;1;0.92" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="192" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#c7d2fe" letter-spacing="3">ACADEMIC RESOURCE &amp; CAREER ASSIST DIGITAL ENVIRONMENT</text>

    <!-- role chips -->
    <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="700" text-anchor="middle">
      <g>
        <rect x="318" y="226" width="130" height="34" rx="17" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.7"/>
        <text x="383" y="248" fill="#67e8f9">STUDENT</text>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="464" y="226" width="130" height="34" rx="17" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.7"/>
        <text x="529" y="248" fill="#a78bfa">FACULTY</text>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="0.7s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="610" y="226" width="130" height="34" rx="17" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.7"/>
        <text x="675" y="248" fill="#f472b6">HOD</text>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="756" y="226" width="130" height="34" rx="17" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.7"/>
        <text x="821" y="248" fill="#fbbf24">ADMIN</text>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#6366f1" stroke-opacity="0.45"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
