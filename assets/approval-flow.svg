<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="ARCADE approval pipelines for notes and resumes" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <clipPath id="clip"><rect width="1200" height="470" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <rect width="1200" height="470" fill="url(#bg)"/>

    <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="2" fill="#67e8f9">LANE 1 · NOTES</text>
    <text x="40" y="272" font-size="13" font-weight="700" letter-spacing="2" fill="#f472b6">LANE 2 · RESUME SAMPLES</text>
    <line x1="40" y1="238" x2="1160" y2="238" stroke="#334155" stroke-dasharray="4 6"/>

    <!-- ===== connectors + travelling packets (drawn first, nodes cover them) ===== -->
    <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M210 110H268"/><path d="M438 110H498"/><path d="M668 110H728"/><path d="M898 110H958"/>
      <path d="M210 340H268"/><path d="M438 340H498"/><path d="M668 340H728"/><path d="M898 340H958"/>
    </g>
    <!-- rejected branches -->
    <path d="M583 145V188" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
    <path d="M583 375V418" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>

    <circle r="6" fill="#67e8f9"><animateMotion dur="6s" repeatCount="indefinite" path="M125 110H1043"/></circle>
    <circle r="6" fill="#67e8f9"><animateMotion dur="6s" begin="3s" repeatCount="indefinite" path="M125 110H1043"/></circle>
    <circle r="6" fill="#f472b6"><animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M125 340H1043"/></circle>
    <circle r="6" fill="#f472b6"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M125 340H1043"/></circle>
    <circle r="5" fill="#ef4444"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite" path="M583 145V188"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#ef4444"><animateMotion dur="2.4s" begin="2.5s" repeatCount="indefinite" path="M583 375V418"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="2.5s" repeatCount="indefinite"/></circle>

    <!-- ===== LANE 1 nodes ===== -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="40" y="75" width="170" height="70" rx="12" fill="#0b2a3a" stroke="#67e8f9"/>
      <text x="125" y="105" fill="#e0f2fe">Student uploads</text><text x="125" y="125" font-size="12" font-weight="400" fill="#7dd3fc">title · subject · file</text>

      <rect x="270" y="75" width="170" height="70" rx="12" fill="#2a2208" stroke="#fbbf24"/>
      <text x="355" y="105" fill="#fef3c7">status: pending</text><text x="355" y="125" font-size="12" font-weight="400" fill="#fcd34d">oldest-first queue</text>

      <rect x="500" y="75" width="170" height="70" rx="12" fill="#241a3d" stroke="#a78bfa"/>
      <text x="585" y="105" fill="#ede9fe">Faculty review</text><text x="585" y="125" font-size="12" font-weight="400" fill="#c4b5fd">POST /api/notes/verify</text>

      <rect x="730" y="75" width="170" height="70" rx="12" fill="#0b2e1f" stroke="#34d399"/>
      <text x="815" y="105" fill="#d1fae5">status: approved</text><text x="815" y="125" font-size="12" font-weight="400" fill="#6ee7b7">verified_by stamped</text>

      <rect x="960" y="75" width="200" height="70" rx="12" fill="#0b2e1f" stroke="#34d399" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="1060" y="105" fill="#d1fae5">Resource Vault</text><text x="1060" y="125" font-size="12" font-weight="400" fill="#6ee7b7">GET /api/notes</text>

      <rect x="483" y="190" width="200" height="40" rx="10" fill="#2f1015" stroke="#ef4444"/>
      <text x="583" y="215" font-size="13" fill="#fecaca">rejected + rejection_reason</text>
    </g>

    <!-- ===== LANE 2 nodes ===== -->
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="40" y="305" width="170" height="70" rx="12" fill="#0b2a3a" stroke="#67e8f9"/>
      <text x="125" y="335" fill="#e0f2fe">Resume submitted</text><text x="125" y="355" font-size="12" font-weight="400" fill="#7dd3fc">domain · experience level</text>

      <rect x="270" y="305" width="170" height="70" rx="12" fill="#2a2208" stroke="#fbbf24"/>
      <text x="355" y="335" fill="#fef3c7">status: pending_hod</text><text x="355" y="355" font-size="12" font-weight="400" fill="#fcd34d">awaits HOD sign-off</text>

      <rect x="500" y="305" width="170" height="70" rx="12" fill="#3a1030" stroke="#f472b6"/>
      <text x="585" y="335" fill="#fce7f3">HOD / admin review</text><text x="585" y="355" font-size="12" font-weight="400" fill="#f9a8d4">POST /api/admin/resumes</text>

      <rect x="730" y="305" width="170" height="70" rx="12" fill="#0b2e1f" stroke="#34d399"/>
      <text x="815" y="335" fill="#d1fae5">status: approved</text><text x="815" y="355" font-size="12" font-weight="400" fill="#6ee7b7">published to vault</text>

      <rect x="960" y="305" width="200" height="70" rx="12" fill="#0b2e1f" stroke="#34d399" stroke-width="2.5">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="1060" y="335" fill="#d1fae5">Resume Vault</text><text x="1060" y="355" font-size="12" font-weight="400" fill="#6ee7b7">filter: domain · level</text>

      <rect x="483" y="420" width="200" height="40" rx="10" fill="#2f1015" stroke="#ef4444"/>
      <text x="583" y="445" font-size="13" fill="#fecaca">rejected + rejection_reason</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="16" fill="none" stroke="#334155"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
