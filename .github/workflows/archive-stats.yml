name: archive-stats

# ─────────────────────────────────────────────────────────────────────────────
#  For completed / mature repos.
#  Runs weekly and also on new releases so the README always looks fresh.
#  Contributes 1 commit per week to the GitHub contribution graph.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 1 * * 6"
  release:
    types: [published]         # also fires when you cut a new release tag
  workflow_dispatch:           # manual trigger

permissions:
  contents: write

concurrency:
  group: archive-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      GH_REPO:  ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Refresh archive stats
        run: python scripts/archive_stats.py
        continue-on-error: true

      - name: Commit archive stats
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || \
            git commit -m "chore: refresh archive stats $(date -u +%F) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # ── optional: tell the profile repo a new release dropped ──
      - name: Notify profile repo
        if: github.event_name == 'release'
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -n "$PROFILE_TOKEN" ]; then
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $PROFILE_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Sp2736/Sp2736/dispatches \
              -d "{\"event_type\":\"project-deployed\",\"client_payload\":{\"repo\":\"${{ github.repository }}\",\"release\":\"${{ github.ref_name }}\"}}"
          fi
        continue-on-error: true
